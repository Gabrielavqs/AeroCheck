services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aerocheck-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Aero@12345"   # somente desenvolvimento local
    ports:
      - "1433:1433"
    volumes:
      - ./database:/scripts:ro
      - sqldata:/var/opt/mssql

volumes:
  sqldata: